version: '3'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-network

  odoo:
    image: odoo:16
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB=odoo
    ports:
      - "8069:8069"
    depends_on:
      - db
    networks:
      - odoo-network

networks:
  odoo-network:

volumes:
  odoo-db-data:
